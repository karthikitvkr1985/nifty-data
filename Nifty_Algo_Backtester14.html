function genRun(){const g=id=>+$("#"+id).value,cap=g("g_cap"),lo=g("g_lo"),hi=g("g_hi"),N=g("g_n"),minT=g("g_min"),K=g("g_k"),M=g("g_top")||15,val=$("#g_val").checked,tfs=[...document.querySelectorAll(".gtf:checked")].map(x=>+x.value);

<div class="sc"><table><tr><th>#</th><th style="text-align:left">Indicators and settings</th><th>TF</th><th>SL %</th><th>Trail %</th><th>Slip</th><th>Trades</th><th>Win %</th><th>PF</th><th>Net ₹</th><th>Max DD ₹</th><th>DD %</th>${GINFO.v?"<th>Unseen net ₹</th><th>Unseen DD %</th>":""}<th></th></tr>${GEN.map((r,k)=>`<tr><td>${k+1}</td><td style="text-align:left">${esc(gdesc(r.s))}</td><td>${r.s.tf>=1440?"1d":r.s.tf+"m"}</td><td>${r.s.sl}</td><td>${r.s.tr||"–"}</td><td>${r.s.slip}</td><td>${r.n}</td><td>${r.wr.toFixed(0)}%</td><td>${r.pf===Infinity?"∞":r.pf.toFixed(2)}</td><td class="${cl(r.net)}">${fmt(r.net)}</td><td>${fmt(r.dd)}</td><td>${r.ddp.toFixed(1)}</td>${GINFO.v?(r.o?`<td class="${cl(r.o.net)}">${fmt(r.o.net)}</td><td>${r.o.ddp.toFixed(1)}</td>`:"<td>–</td><td>–</td>"):""}<td><button data-a="gedit" data-i="${k}">${GOPEN===k?"Hide":"View / edit"}</button> <button data-a="gapply" data-i="${k}">Apply</button></td></tr>${GOPEN===k?gedit(k,r.s):""}`).join("")}</table></div></section>`;$("#gen").scrollTop=y}
$("#gen").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!GINFO)return;const a=b.dataset.a,k=+b.dataset.i;if(a==="gopen")return genOpen();if(a==="gedit"){GOPEN=GOPEN===k?-1:k;genTable();if(GOPEN===k)GEN[k]&&showLog(Object.assign(backtest(GEN[k].s)));return}
if(a==="grerun"){const c=GEN[k];if(!c)return;const s=JSON.parse(JSON.stringify(c.s));document.querySelectorAll('#gen [data-gk="'+k+'"]').forEach(el=>setP(s,el.dataset.gp,parseFloat(el.value)||0));fixM(s);
try{const r=backtest(s),st=r.st,ddp=st.dd/GINFO.cap*100;if(GINFO.v)try{const s2=JSON.parse(JSON.stringify(s));s2.from=GINFO.te[0];s2.to=GINFO.te[1];const q=backtest(s2).st;c.o={n:q.n,net:q.net,ddp:q.dd/GINFO.cap*100}}catch(e2){}Object.assign(c,{s,n:st.n,net:st.net,dd:st.dd,ddp,wr:st.wr,pf:st.pf,ok:ddp>=GINFO.lo&&ddp<=GINFO.hi&&st.net>0});show(r);showLog(r);genTable();msg("Re-ran: ₹ "+fmt(st.net)+" net, "+ddp.toFixed(1)+"% drawdown, "+st.n+" trades")}catch(err){msg("Error: "+err.message)}}});

$("#gen").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;if(a==="gstart")genRun();else if(a==="gstop")genStop=true;else if(a==="gapply"){const c=GEN[+b.dataset.i];if(!c)return;const s=JSON.parse(JSON.stringify(c.s));s.name="Gen: "+gdesc(s);delete s.from;delete s.to;S.push(s);cur=S.length-1;persist();render();live=true;go();msg("Applied as a new saved strategy")}});
$("#gen").addEventListener("change",e=>{if(e.target.id==="g_k"||e.target.classList.contains("gtf"))gspace()});
/* ---------- Trade log ---------- */
let LT=[],LN=300,logT=0,LR=null;
const px2=v=>(+v).toFixed(2);
function tlog(r){const B=r.B,sl=+r.s.slip||0;return r.trades.map((x,k)=>{const L=x.side>0,sg=x.why==="Signal",si=Math.max(0,x.ei-1);
return{k:k+1,ea:L?"BUY":"SELL",xa:L?"SELL":"BUY",esT:ts(B.t[si]),esP:B.c[si],eT:ts(x.eT),eP:x.ep,xsT:sg?ts(B.t[Math.max(0,x.xi-1)]):ts(x.xT),xsP:sg?B.c[Math.max(0,x.xi-1)]:(x.tg!=null?x.tg:x.xp+x.side*sl),xT:ts(x.xT),xP:x.xp,why:x.why,pts:x.pts,chg:x.chg,net:x.net,cum:r.st.cum[k]}})}
function showLog(r){LR=r;LT=tlog(r);const n=LT.length,cl=v=>v>=0?"u":"d",tf=Math.max(r.s.tf,D.bar);
$("#log").innerHTML=`<section><h3>Trade log · ${esc(r.s.name)} · ${tf>=1440?"1 day":tf+" min"} candles ${r.s.from?"· "+r.s.from+" → "+r.s.to:""} <span class="mu">· ${n} trades, run fresh on this timeframe</span></h3>
<div class="mu" style="margin-bottom:6px">Signal = the candle close where the rule became true. Order = the price and time it was actually filled (next candle open, with slippage). Stop loss, trailing stop and target exits trigger and fill within the same candle.</div>
<div class="row" style="margin-bottom:6px"><button data-a="lcsv">⬇ CSV (this strategy)</button><button data-a="lall">⬇ CSV (all strategies)</button>${n>LN?`<button data-a="lmore">Show all ${n} trades</button>`:""}</div>
<div class="sc" style="max-height:60vh;overflow:auto"><table><tr><th>#</th><th>Entry</th><th>Entry signal time</th><th>Signal price</th><th>Entry order time</th><th>Entry fill price</th><th>Exit</th><th>Exit signal time</th><th>Signal price</th><th>Exit order time</th><th>Exit fill price</th><th>Reason</th><th>Pts</th><th>Charges ₹</th><th>Net ₹</th><th>Cum ₹</th></tr>${LT.slice(0,LN).map(t=>`<tr><td>${t.k}</td><td>${t.ea}</td><td>${t.esT}</td><td>${px2(t.esP)}</td><td>${t.eT}</td><td>${px2(t.eP)}</td><td>${t.xa}</td><td>${t.xsT}</td><td>${px2(t.xsP)}</td><td>${t.xT}</td><td>${px2(t.xP)}</td><td>${esc(t.why)}</td><td class="${cl(t.pts)}">${px2(t.pts)}</td><td>${fmt(t.chg)}</td><td class="${cl(t.net)}">${fmt(t.net)}</td><td class="${cl(t.cum)}">${fmt(t.cum)}</td></tr>`).join("")}</table></div></section>`}
function dl(name,txt){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const HDR=["Entry action","Entry signal time","Entry signal price","Entry order time","Entry fill price","Exit action","Exit signal time","Exit signal price","Exit order time","Exit fill price","Reason","Points","Charges","Net","Cumulative"];
const csvq=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v,trow=t=>[t.ea,t.esT,px2(t.esP),t.eT,px2(t.eP),t.xa,t.xsT,px2(t.xsP),t.xT,px2(t.xP),t.why,px2(t.pts),Math.round(t.chg),Math.round(t.net),Math.round(t.cum)];
$("#log").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;if(a==="lmore"){LN=1e9;showLog(LR)}
else if(a==="lcsv"&&LR)dl("trades_"+LR.s.name.replace(/\W+/g,"_")+".csv",[["#"].concat(HDR).map(csvq).join(",")].concat(LT.map(t=>[t.k].concat(trow(t)).map(csvq).join(","))).join("\n"));
else if(a==="lall"){msg("Running every strategy for the trade log…");setTimeout(()=>{const o=[["Strategy","Timeframe","#"].concat(HDR).join(",")];for(const s of S){try{const r=backtest(s),tf=Math.max(s.tf,D.bar);tlog(r).forEach(t=>o.push([s.name,tf+"m",t.k].concat(trow(t)).map(csvq).join(",")))}catch(err){}}dl("all_strategies_trades.csv",o.join("\n"));msg("Exported trade logs of "+S.length+" strategies")},20)}});
function setTheme(m){document.documentElement.dataset.theme=m;try{localStorage.setItem("nbt_theme",m)}catch(e){}$("#thm").textContent=m==="dark"?"☀ Light":"🌙 Dark"}
{let m="light";try{m=localStorage.getItem("nbt_theme")||"light"}catch(e){}setTheme(m)}
$("#thm").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
render();
</script></body></html>
