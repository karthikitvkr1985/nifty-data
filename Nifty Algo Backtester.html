</style></head><body>
<header><b>Nifty Algo Backtester</b><span id="msg" class="mu">Load your 1-minute CSV to begin</span></header>
<div id="app"><aside id="side"></aside><main>
<div id="cmp"></div><div id="sum" class="cards"></div>

<script>
const $=s=>document.querySelector(s),nan=n=>new Float64Array(n).fill(NaN),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DEF={ST:{period:10,mult:3},BB:{period:20,mult:2},VWAP:{},CPR:{},PIV:{},RSI:{period:14},CCI:{period:20},WR:{period:14},SAR:{step:0.02,max:0.2}};
const OUT={ST:["","dir"],BB:["up","mid","lo"],VWAP:[""],CPR:["pp","tc","bc"],PIV:["pp","r1","r2","r3","s1","s2","s3"],RSI:[""],CCI:[""],WR:[""],SAR:[""]};
const NAMES={ST:"Supertrend",BB:"Bollinger Bands",VWAP:"VWAP",CPR:"Central Pivot Range",PIV:"Pivot Points",RSI:"RSI",CCI:"CCI",WR:"Williams %R",SAR:"Parabolic SAR"};
const GR={enL:"▲ LONG ENTRY: buy when ALL true",exL:"▲ LONG EXIT: sell when ALL true",enS:"▼ SHORT ENTRY: sell when ALL true",exS:"▼ SHORT EXIT: buy back when ALL true"};
const OPS=[[">",">"],["<","<"],[">=","≥"],["<=","≤"],["xa","crosses above"],["xb","crosses below"]];
let D=null,S=[],cur=0,R=null,win=0,eqC,eqS,pxC,pxS,ov=[],lastWin=null;
const R_=(l,op,r)=>({l,op,r});
const RG={};function BASE(){return{tf:5,qty:75,slT:"pts",sl:0,tpT:"pts",tp:0,trT:"pts",tr:0,tra:0,slip:0,brk:20,chg:0.01,sq:true}}
function mkS(name,inds,rules){return{...BASE(),name,inds:inds.map(([type,id])=>({type,id,p:{...DEF[type]}})),rules:{enL:[],exL:[],enS:[],exS:[],...rules}}}
function presets(){return[
mkS("Supertrend + RSI",[["ST","ST1"],["RSI","RSI1"]],{enL:[R_("ST1.dir[1]","<","0"),R_("ST1.dir",">","0"),R_("RSI1",">","50")],exL:[R_("ST1.dir","<","0")],enS:[R_("ST1.dir[1]",">","0"),R_("ST1.dir","<","0"),R_("RSI1","<","50")],exS:[R_("ST1.dir",">","0")]}),
mkS("BB reversion + Williams %R",[["BB","BB1"],["WR","WR1"]],{enL:[R_("close","<","BB1.lo"),R_("WR1","<","-80")],exL:[R_("close",">","BB1.mid")],enS:[R_("close",">","BB1.up"),R_("WR1",">","-20")],exS:[R_("close","<","BB1.mid")]}),
mkS("CPR breakout + PSAR",[["CPR","CPR1"],["SAR","SAR1"]],{enL:[R_("close","xa","CPR1.tc"),R_("close",">","SAR1")],exL:[R_("close","<","SAR1")],enS:[R_("close","xb","CPR1.bc"),R_("close","<","SAR1")],exS:[R_("close",">","SAR1")]})]}
try{S=JSON.parse(localStorage.getItem("nbt")||"[]")}catch(e){}if(!S.length)S=presets();S=S.map(s=>({...BASE(),...s}));
const save=()=>{try{localStorage.setItem("nbt",JSON.stringify(S))}catch(e){}};
const outs=i=>OUT[i.type].map(k=>k?i.id+"."+k:i.id);
const msg=t=>$("#msg").textContent=t,fmt=n=>Math.round(n).toLocaleString("en-IN"),ts=t=>new Date(t*1000).toISOString().slice(0,16).replace("T"," ");
const get=(o,p)=>p.split(".").reduce((a,k)=>a&&a[k],o);
function setP(o,p,v){const k=p.split(".");const l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v}
/* ---------- data ---------- */
async function load(f){msg("Reading file…");const tx=await f.text();const cap=Math.ceil(tx.length/40);
const t=new Float64Array(cap),o=new Float64Array(cap),h=new Float64Array(cap),l=new Float64Array(cap),c=new Float64Array(cap);let n=0,p=tx.indexOf("\n")+1;
while(p<tx.length){let e=tx.indexOf("\n",p);if(e<0)e=tx.length;const ln=tx.slice(p,e);p=e+1;if(ln.length<20)continue;const a=ln.split(",");
const v=Date.UTC(+ln.slice(0,4),+ln.slice(5,7)-1,+ln.slice(8,10),+ln.slice(11,13),+ln.slice(14,16))/1000;if(isNaN(v)||isNaN(+a[4]))continue;
t[n]=v;o[n]=+a[1];h[n]=+a[2];l[n]=+a[3];c[n]=+a[4];n++}
D={t:t.subarray(0,n),o:o.subarray(0,n),h:h.subarray(0,n),l:l.subarray(0,n),c:c.subarray(0,n),n};
D.from=ts(D.t[0]).slice(0,10);D.to=ts(D.t[n-1]).slice(0,10);msg(fmt(n)+" 1-min candles loaded ("+D.from+" → "+D.to+")");render()}
function lb(a,x){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;a[m]<x?lo=m+1:hi=m}return lo}
function resample(tf,from,to){const{t,o,h,l,c}=D,a=lb(t,from),b=lb(t,to+86400),T=[],O=[],H=[],L=[],C=[];let key=-1e12;
for(let i=a;i<b;i++){const d=Math.floor(t[i]/86400),m=(t[i]-d*86400)/60,k=d*1000+Math.floor((m-555)/tf);
if(k!==key){key=k;T.push(t[i]);O.push(o[i]);H.push(h[i]);L.push(l[i]);C.push(c[i])}else{const j=T.length-1;if(h[i]>H[j])H[j]=h[i];if(l[i]<L[j])L[j]=l[i];C[j]=c[i]}}
const F=Float64Array.from.bind(Float64Array);return{t:F(T),o:F(O),h:F(H),l:F(L),c:F(C)}}
/* ---------- indicators ---------- */
function atr(B,p){const n=B.c.length,tr=new Float64Array(n),r=nan(n);let s=0;for(let i=0;i<n;i++){tr[i]=i?Math.max(B.h[i]-B.l[i],Math.abs(B.h[i]-B.c[i-1]),Math.abs(B.l[i]-B.c[i-1])):B.h[i]-B.l[i];
if(i<p-1)s+=tr[i];else if(i===p-1){s+=tr[i];r[i]=s/p}else r[i]=(r[i-1]*(p-1)+tr[i])/p}return r}
function prevDay(B){const n=B.t.length,ph=nan(n),pl=nan(n),pc=nan(n);let day=-1,H=0,L=0,C=0,pH=NaN,pL=NaN,pC=NaN;
for(let i=0;i<n;i++){const d=Math.floor(B.t[i]/86400);if(d!==day){if(day>=0){pH=H;pL=L;pC=C}day=d;H=B.h[i];L=B.l[i]}else{H=Math.max(H,B.h[i]);L=Math.min(L,B.l[i])}C=B.c[i];ph[i]=pH;pl[i]=pL;pc[i]=pC}return[ph,pl,pc]}
function calc(x,B){const n=B.c.length,p=x.p,{h,l,c}=B;
if(x.type==="RSI"){const r=nan(n);let g=0,s=0;const P=p.period;for(let i=1;i<n;i++){const d=c[i]-c[i-1],u=d>0?d:0,v=d<0?-d:0;
if(i<=P){g+=u;s+=v;if(i===P){g/=P;s/=P;r[i]=s?100-100/(1+g/s):100}}else{g=(g*(P-1)+u)/P;s=(s*(P-1)+v)/P;r[i]=s?100-100/(1+g/s):100}}return{"":r}}
if(x.type==="ST"){const A=atr(B,p.period),line=nan(n),dir=nan(n);let up=0,dn=0,tr=1;
for(let i=0;i<n;i++){if(isNaN(A[i]))continue;const hl=(h[i]+l[i])/2;let u=hl-p.mult*A[i],d=hl+p.mult*A[i];
if(i>0&&!isNaN(A[i-1])){if(c[i-1]>up)u=Math.max(u,up);if(c[i-1]<dn)d=Math.min(d,dn);if(tr===-1&&c[i]>dn)tr=1;else if(tr===1&&c[i]<up)tr=-1}
up=u;dn=d;line[i]=tr===1?u:d;dir[i]=tr}return{"":line,dir}}
if(x.type==="BB"){const P=p.period,U=nan(n),M=nan(n),Lo=nan(n);for(let i=P-1;i<n;i++){let s=0,v=0;for(let j=i-P+1;j<=i;j++)s+=c[j];const m=s/P;for(let j=i-P+1;j<=i;j++)v+=(c[j]-m)**2;const sd=Math.sqrt(v/P);M[i]=m;U[i]=m+p.mult*sd;Lo[i]=m-p.mult*sd}return{up:U,mid:M,lo:Lo}}
if(x.type==="CCI"){const P=p.period,r=nan(n),tp=new Float64Array(n);for(let i=0;i<n;i++)tp[i]=(h[i]+l[i]+c[i])/3;
for(let i=P-1;i<n;i++){let s=0,v=0;for(let j=i-P+1;j<=i;j++)s+=tp[j];const m=s/P;for(let j=i-P+1;j<=i;j++)v+=Math.abs(tp[j]-m);r[i]=v?(tp[i]-m)/(0.015*v/P):0}return{"":r}}
if(x.type==="WR"){const P=p.period,r=nan(n);for(let i=P-1;i<n;i++){let hh=-1e18,ll=1e18;for(let j=i-P+1;j<=i;j++){if(h[j]>hh)hh=h[j];if(l[j]<ll)ll=l[j]}r[i]=hh>ll?(hh-c[i])/(hh-ll)*-100:-50}return{"":r}}
if(x.type==="SAR"){const r=nan(n),st=p.step,mx=p.max;if(n<3)return{"":r};let bull=c[1]>=c[0],ep=bull?h[1]:l[1],s=bull?l[0]:h[0],af=st;r[1]=s;
for(let i=2;i<n;i++){s=s+af*(ep-s);if(bull){s=Math.min(s,l[i-1],l[i-2]);if(l[i]<s){bull=false;s=ep;ep=l[i];af=st}else if(h[i]>ep){ep=h[i];af=Math.min(af+st,mx)}}
else{s=Math.max(s,h[i-1],h[i-2]);if(h[i]>s){bull=true;s=ep;ep=h[i];af=st}else if(l[i]<ep){ep=l[i];af=Math.min(af+st,mx)}}r[i]=s}return{"":r}}
if(x.type==="VWAP"){const r=nan(n);let day=-1,s=0,k=0;for(let i=0;i<n;i++){const d=Math.floor(B.t[i]/86400);if(d!==day){day=d;s=0;k=0}s+=(h[i]+l[i]+c[i])/3;k++;r[i]=s/k}return{"":r}}
const[H,L,C]=prevDay(B),P=nan(n),a={},K=k=>a[k]=nan(n);
if(x.type==="CPR"){const pp=K("pp"),tc=K("tc"),bc=K("bc");for(let i=0;i<n;i++){const q=(H[i]+L[i]+C[i])/3,b=(H[i]+L[i])/2,t=2*q-b;pp[i]=q;tc[i]=Math.max(t,b);bc[i]=Math.min(t,b)}return a}
const pp=K("pp"),r1=K("r1"),r2=K("r2"),r3=K("r3"),s1=K("s1"),s2=K("s2"),s3=K("s3");
for(let i=0;i<n;i++){const q=(H[i]+L[i]+C[i])/3,g=H[i]-L[i];pp[i]=q;r1[i]=2*q-L[i];s1[i]=2*q-H[i];r2[i]=q+g;s2[i]=q-g;r3[i]=H[i]+2*(q-L[i]);s3[i]=L[i]-2*(H[i]-q)}return a}
/* ---------- rule engine ---------- */
function tok(s,ser){s=String(s).trim();if(s!==""&&!isNaN(+s)){const v=+s;return{g:()=>v}}const m=s.match(/^([\w.]+)(?:\[(\d+)\])?$/);if(!m||!ser[m[1]])throw Error("Unknown series “"+s+"”");const a=ser[m[1]],o=+(m[2]||0);return{g:i=>i-o>=0?a[i-o]:NaN}}
function compile(r,ser){const L=tok(r.l,ser),Rr=tok(r.r,ser),op=r.op;return i=>{const a=L.g(i),b=Rr.g(i);
if(op===">")return a>b;if(op==="<")return a<b;if(op===">=")return a>=b;if(op==="<=")return a<=b;const pa=L.g(i-1),pb=Rr.g(i-1);return op==="xa"?pa<=pb&&a>b:pa>=pb&&a<b}}
function backtest(s){const from=Date.parse(s.from||$("#from").value)/1000,to=Date.parse($("#to").value)/1000,B=resample(s.tf,from,to),n=B.t.length,ser={open:B.o,high:B.h,low:B.l,close:B.c};
s.inds.forEach(x=>{const r=calc(x,B);for(const k in r)ser[k?x.id+"."+k:x.id]=r[k]});
const ru={};for(const k in GR)ru[k]=s.rules[k].filter(r=>String(r.l).trim()&&String(r.r).trim()).map(r=>compile(r,ser));
const all=(f,i)=>f.length>0&&f.every(g=>g(i)),day=i=>Math.floor(B.t[i]/86400),trades=[];if(!ru.enL.length&&!ru.enS.length)throw Error("Add at least one entry condition (long or short) before running");
let pos=0,ep=0,ei=0,pend=null,best=0;const dist=(t,v,r)=>t==="pct"?r*v/100:v,sp=+s.slip||0;
const close=(i,px,why)=>{const xp=px-pos*sp,pts=pos*(xp-ep),chg=2*(+s.brk||0)+(+s.chg||0)/100*(ep+xp)*s.qty;trades.push({side:pos,ei,xi:i,eT:B.t[ei],xT:B.t[i],ep,xp,why,pts,chg,net:pts*s.qty-chg});pos=0};
for(let i=0;i<n;i++){
if(pend){if(pos)close(i,B.o[i],"Signal");if(pend!=="X"){pos=pend==="L"?1:-1;ep=B.o[i]+pos*sp;ei=i;best=ep}pend=null}
if(pos){const sd=dist(s.slT,s.sl,ep),td=dist(s.tpT,s.tp,ep),rd=dist(s.trT,s.tr,ep),ad=dist(s.trT,s.tra,ep);let stop=s.sl>0?ep-pos*sd:NaN,why="Stop loss";
if(s.tr>0&&(best-ep)*pos>=ad){const tl=best-pos*rd;if(isNaN(stop)||(tl-stop)*pos>0){stop=tl;why="Trailing stop"}}
const tp=s.tp>0?ep+pos*td:NaN,hs=!isNaN(stop)&&(pos>0?B.l[i]<=stop:B.h[i]>=stop),ht=!isNaN(tp)&&(pos>0?B.h[i]>=tp:B.l[i]<=tp);
if(hs)close(i,pos>0?Math.min(stop,B.o[i]):Math.max(stop,B.o[i]),why);else if(ht)close(i,tp,"Target");else best=pos>0?Math.max(best,B.h[i]):Math.min(best,B.l[i])}
if(s.sq&&(i===n-1||day(i+1)!==day(i))){if(pos)close(i,B.c[i],"EOD square-off");continue}
const eL=all(ru.enL,i),eS=all(ru.enS,i);
if(pos>0){if(eS)pend="S";else if(all(ru.exL,i))pend="X"}else if(pos<0){if(eL)pend="L";else if(all(ru.exS,i))pend="X"}else{if(eL)pend="L";else if(eS)pend="S"}}
if(pos)close(n-1,B.c[n-1],"End of data");return{B,ser,trades,st:stats(trades,s.qty),s}}
function stats(tr,q){let eq=0,pk=0,dd=0,w=0,gw=0,gl=0,lp=0,sp=0,b=-1e18,wo=1e18;const cum=[];
for(const x of tr){const p=x.net;eq+=p;cum.push(eq);if(eq>pk)pk=eq;dd=Math.max(dd,pk-eq);if(p>0){w++;gw+=p}else gl-=p;if(x.side>0)lp+=p;else sp+=p;b=Math.max(b,p);wo=Math.min(wo,p)}
const n=tr.length;return{n,net:eq,fees:tr.reduce((a,x)=>a+x.chg,0),pts:tr.reduce((a,x)=>a+x.pts,0),wr:n?w/n*100:0,pf:gl?gw/gl:gw?Infinity:0,dd,lp,sp,best:n?b:0,worst:n?wo:0,aw:w?gw/w:0,al:n-w?gl/(n-w):0,cum}}
/* ---------- UI ---------- */
function fld(s,l,p,type="number",x=""){const v=get(s,p);return`<label>${l}<input data-p="${p}" ${type==="number"?'data-n="1" step="any"':""} type="${type}" ${type==="checkbox"?(v?"checked":""):`value="${esc(v)}"`} ${x}></label>`}
const rk=(s,l,v,t)=>`<label>${l}<span class="row" style="margin:0"><input data-p="${v}" data-n="1" type="number" step="any" value="${s[v]}"><select data-p="${t}"><option value="pts" ${s[t]==="pts"?"selected":""}>pts</option><option value="pct" ${s[t]==="pct"?"selected":""}>%</option></select></span></label>`;
function render(){const s=S[cur],names=["open","high","low","close"].concat(...s.inds.map(outs));
$("#side").innerHTML=`<div class="box"><h4>1 · Data</h4><input type="file" id="file" accept=".csv"><div class="mu" style="margin-top:4px">${D?fmt(D.n)+" candles · "+D.from+" → "+D.to:"Expected columns: date,open,high,low,close"}</div></div>
<div class="box"><h4>2 · Strategy</h4><div class="row"><select id="sel">${S.map((x,i)=>`<option value="${i}" ${i===cur?"selected":""}>${esc(x.name)}</option>`).join("")}</select><button data-a="new" title="New">＋</button><button data-a="dup" title="Duplicate">⧉</button><button data-a="del" title="Delete">✕</button></div>
<div class="g">${fld(s,"Name","name","text")}<label>Timeframe<select data-p="tf" data-n="1">${[[1,"1 min"],[3,"3 min"],[5,"5 min"],[15,"15 min"],[60,"1 hour"]].map(([v,t])=>`<option value="${v}" ${v===s.tf?"selected":""}>${t}</option>`).join("")}</select></label>
<label>From<input type="date" id="from" value="${RG.from||(D?D.from:"")}"></label><label>To<input type="date" id="to" value="${RG.to||(D?D.to:"")}"></label>
${fld(s,"Quantity (units/lot)","qty")}${fld(s,"Square off at day end","sq","checkbox")}</div></div>
<div class="box"><h4>3 · Risk &amp; costs <span class="mu">(0 = off)</span></h4><div class="g">${rk(s,"Stop loss","sl","slT")}${rk(s,"Target","tp","tpT")}${rk(s,"Trailing stop distance","tr","trT")}${fld(s,"Trail starts after profit (same unit)","tra")}${fld(s,"Slippage (pts per fill)","slip")}${fld(s,"Brokerage (₹ per order)","brk")}${fld(s,"Other charges (% of turnover)","chg")}</div><div class="mu">Slippage works against you on every entry and exit. Brokerage is charged on both orders of a round trip. Other charges stand in for STT, exchange fees, GST and stamp duty, so set them to your broker’s rates. Stops fill at the candle open if price gaps through them, and the stop is checked before the target inside a candle.</div></div>
<div class="box"><h4>4 · Indicators</h4>${s.inds.map((x,i)=>`<div class="ind"><div class="row"><b>${NAMES[x.type]}</b><input data-p="inds.${i}.id" value="${esc(x.id)}" title="Name used in rules" style="max-width:80px"><button data-a="rmi" data-i="${i}">✕</button></div>
<div class="row">${Object.keys(x.p).map(k=>fld(s,k,`inds.${i}.p.${k}`)).join("")||'<span class="mu">no settings (uses prior-day / session data)</span>'}</div><div class="mu">${outs(x).join(", ")}</div></div>`).join("")}
<div class="row"><select id="addt">${Object.keys(NAMES).map(k=>`<option value="${k}">${NAMES[k]}</option>`).join("")}</select><button data-a="addi">Add</button></div>
<div class="mu">VWAP has no volume in this CSV, so it is an equal-weight session average of (H+L+C)/3.</div></div>
<div class="box"><h4>5 · Entry &amp; exit conditions</h4><div class="mu" style="margin-bottom:6px">Use open, high, low, close or an indicator output. Add [n] for n candles back, e.g. close[1]. Numbers allowed. A position closes on its exit conditions, an opposite entry signal, stop loss, target, trailing stop or day-end square-off, whichever comes first. At least one entry condition is required.</div>
${Object.keys(GR).map(g=>`<b>${GR[g]}</b><div style="margin:4px 0 8px">${s.rules[g].map((r,i)=>`<div class="rule"><input list="sl" data-p="rules.${g}.${i}.l" value="${esc(r.l)}"><select data-p="rules.${g}.${i}.op">${OPS.map(([v,t])=>`<option value="${v}" ${v===r.op?"selected":""}>${t}</option>`).join("")}</select><input list="sl" data-p="rules.${g}.${i}.r" value="${esc(r.r)}"><button data-a="rmr" data-g="${g}" data-i="${i}">✕</button></div>`).join("")}<button data-a="addr" data-g="${g}">+ condition</button></div>`).join("")}
<datalist id="sl">${names.flatMap(n=>[n,n+"[1]"]).map(n=>`<option value="${n}">`).join("")}</datalist></div>
<div class="row"><button class="p" data-a="run">▶ Run backtest</button><button data-a="all">Compare all strategies</button></div>`}
$("#side").addEventListener("input",e=>{const t=e.target,p=t.dataset.p;if(t.id==="from"||t.id==="to")RG[t.id]=t.value;if(!p)return;setP(S[cur],p,t.type==="checkbox"?t.checked:t.dataset.n?parseFloat(t.value)||0:t.value);save()});
$("#side").addEventListener("change",e=>{if(e.target.id==="file"&&e.target.files[0])load(e.target.files[0]);if(e.target.id==="sel"){cur=+e.target.value;render()}});
$("#side").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,s=S[cur],i=+b.dataset.i,g=b.dataset.g;
if(a==="new"){S.push(mkS("Strategy "+(S.length+1),[],{}));cur=S.length-1}else if(a==="dup"){const c=JSON.parse(JSON.stringify(s));c.name+=" copy";S.push(c);cur=S.length-1}
else if(a==="del"&&S.length>1){S.splice(cur,1);cur=0}else if(a==="rmi")s.inds.splice(i,1);
else if(a==="addi"){const t=$("#addt").value;let k=1;while(s.inds.some(x=>x.id===t+k))k++;s.inds.push({type:t,id:t+k,p:{...DEF[t]}})}
else if(a==="addr")s.rules[g].push(R_("close",">",""));else if(a==="rmr")s.rules[g].splice(i,1);
else if(a==="run")return run();else if(a==="all")return runAll();save();render()});
function guard(){if(!D){msg("Load the CSV first");return false}return true}
function run(){if(!guard())return;msg("Running…");setTimeout(()=>{try{R=backtest(S[cur]);show(R);msg(S[cur].name+": "+R.st.n+" trades")}catch(e){msg("Error: "+e.message)}},20)}
function runAll(){if(!guard())return;msg("Running all strategies…");setTimeout(()=>{try{const rows=S.map(s=>{const r=backtest(s);return`<tr><td style="text-align:left">${esc(s.name)}</td><td>${s.tf}m</td><td>${r.st.n}</td><td>${r.st.wr.toFixed(1)}%</td><td>${r.st.pf===Infinity?"∞":r.st.pf.toFixed(2)}</td><td>${fmt(r.st.dd)}</td><td class="${r.st.net>=0?"u":"d"}">${fmt(r.st.net)}</td></tr>`}).join("");
$("#cmp").innerHTML=`<section><h3>Strategy comparison (net P&amp;L in ₹)</h3><div class="sc"><table><tr><th style="text-align:left">Strategy</th><th>TF</th><th>Trades</th><th>Win %</th><th>PF</th><th>Max DD</th><th>Net ₹</th></tr>${rows}</table></div></section>`;msg("Comparison done")}catch(e){msg("Error: "+e.message)}},20)}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mk(id){return LightweightCharts.createChart($(id),{autoSize:true,layout:{background:{color:css("--pn")},textColor:css("--tx")},grid:{vertLines:{color:css("--bd")},horzLines:{color:css("--bd")}},timeScale:{timeVisible:true,secondsVisible:false}})}
function show(r){const q=r.s.qty,x=r.st,c=(k,v,cl="")=>`<div class="card"><small>${k}</small><b class="${cl}">${v}</b></div>`,pn=v=>v>=0?"u":"d";
$("#sum").innerHTML=c("Net P&L after costs (₹)",fmt(x.net),pn(x.net))+c("Net points",fmt(x.pts),pn(x.pts))+c("Trades",x.n)+c("Win rate",x.wr.toFixed(1)+"%")+c("Profit factor",x.pf===Infinity?"∞":x.pf.toFixed(2))+c("Max drawdown (₹)",fmt(x.dd),"d")+c("Avg win / loss (₹)",fmt(x.aw)+" / "+fmt(x.al))+c("Best / worst (₹)",fmt(x.best)+" / "+fmt(x.worst))+c("Long P&L (₹)",fmt(x.lp),pn(x.lp))+c("Short P&L (₹)",fmt(x.sp),pn(x.sp))+c("Total charges (₹)",fmt(x.fees),"d");
if(!eqC){eqC=mk("#eq");eqS=eqC.addLineSeries({color:css("--ac"),lineWidth:2});pxC=mk("#px");pxS=pxC.addCandlestickSeries({upColor:css("--up"),downColor:css("--dn"),borderVisible:false,wickUpColor:css("--up"),wickDownColor:css("--dn")})}
eqS.setData(r.trades.map((t,i)=>({time:t.xT,value:x.cum[i]})));eqC.timeScale().fitContent();
const yr={};r.trades.forEach(t=>{const y=new Date(t.xT*1000).getUTCFullYear(),o=yr[y]||(yr[y]={n:0,w:0,p:0});o.n++;o.p+=t.net;if(t.net>0)o.w++});
$("#yr").innerHTML=`<table><tr><th style="text-align:left">Year</th><th>Trades</th><th>Win %</th><th>Net ₹</th></tr>${Object.keys(yr).map(y=>`<tr><td style="text-align:left">${y}</td><td>${yr[y].n}</td><td>${(yr[y].w/yr[y].n*100).toFixed(1)}%</td><td class="${pn(yr[y].p)}">${fmt(yr[y].p)}</td></tr>`).join("")}</table>`;
const L=r.trades.slice(0,2000);$("#tr").innerHTML=`<table><tr><th>#</th><th>Side</th><th>Entry time</th><th>Entry</th><th>Exit time</th><th>Exit</th><th>Reason</th><th>Pts</th><th>Charges ₹</th><th>Net P&L ₹</th></tr>${L.map((t,i)=>`<tr data-i="${i}"><td>${i+1}</td><td class="${t.side>0?"u":"d"}">${t.side>0?"LONG":"SHORT"}</td><td>${ts(t.eT)}</td><td>${t.ep.toFixed(2)}</td><td>${ts(t.xT)}</td><td>${t.xp.toFixed(2)}</td><td>${t.why}</td><td class="${pn(t.pts)}">${t.pts.toFixed(2)}</td><td>${fmt(t.chg)}</td><td class="${pn(t.net)}">${fmt(t.net)}</td></tr>`).join("")}</table>${r.trades.length>2000?'<div class="mu">Showing first 2000 trades; totals above include all.</div>':""}`;
jump(r.trades.length?r.trades[0].ei:r.B.t.length-1)}
function jump(c){win=c;if(!R)return;const B=R.B,n=B.t.length;let a=Math.max(0,c-200),b=Math.min(n,a+400);a=Math.max(0,b-400);
pxS.setData(Array.from({length:b-a},(_,k)=>({time:B.t[a+k],open:B.o[a+k],high:B.h[a+k],low:B.l[a+k],close:B.c[a+k]})));
ov.forEach(s=>pxC.removeSeries(s));ov=[];const pal=["#ff9800","#9c27b0","#00bcd4","#e91e63","#8bc34a","#795548","#607d8b","#ffc107"];let ci=0;
for(const k in R.ser){if(/^(open|high|low|close)$/.test(k)||/\.dir$/.test(k))continue;const d=[];for(let i=a;i<b;i++)if(!isNaN(R.ser[k][i]))d.push({time:B.t[i],value:R.ser[k][i]});
const s=pxC.addLineSeries({color:pal[ci++%pal.length],lineWidth:1,title:k,priceLineVisible:false,lastValueVisible:false});s.setData(d);ov.push(s)}
const m=[];R.trades.forEach(t=>{if(t.ei>=a&&t.ei<b)m.push({time:t.eT,position:t.side>0?"belowBar":"aboveBar",color:t.side>0?css("--up"):css("--dn"),shape:t.side>0?"arrowUp":"arrowDown",text:t.side>0?"L":"S"});
if(t.xi>=a&&t.xi<b)m.push({time:t.xT,position:t.side>0?"aboveBar":"belowBar",color:css("--mu"),shape:"circle",text:t.pts.toFixed(0)})});
m.sort((x,y)=>x.time-y.time);pxS.setMarkers(m);pxC.timeScale().fitContent()}
$("#tr").addEventListener("click",e=>{const r=e.target.closest("tr[data-i]");if(r&&R)jump(R.trades[+r.dataset.i].ei)});
$("#pp").onclick=()=>jump(Math.max(0,win-300));$("#pn").onclick=()=>R&&jump(Math.min(R.B.t.length-1,win+300));
render();
</script></body></html>
